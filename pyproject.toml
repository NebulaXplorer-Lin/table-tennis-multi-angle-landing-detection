[project]
name = "pingpong-local"
version = "0.1.0"
description = "Local Blackwell development environment; not the competition runtime"
requires-python = ">=3.10,<3.11"
dependencies = [
    "torch==2.7.1",
    "torchvision==0.22.1",
    "numpy==1.26.4",
    "onnx==1.16.2",
    "onnxruntime-gpu==1.22.0",
    "opencv-python-headless==4.11.0.86",
    "scipy==1.15.3",
    "av==15.1.0",
    "imageio-ffmpeg==0.6.0",
]

[tool.uv]
package = false
no-build = true
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
